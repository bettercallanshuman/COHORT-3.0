<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Weeknd Tribute</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; color: #e0e0e0; line-height: 1.6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background-color: #1e1e1e; padding: 30px; border-radius: 10px; }
        h1, h2, h3 { color: #ffffff; border-bottom: 2px solid #333; }
        a { color: #ff4d4d; text-decoration: none; }
        .media-box { background-color: #2a2a2a; padding: 15px; border-radius: 8px; margin-top: 15px; }
        img, iframe { max-width: 100%; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 10px; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>The Weeknd</h1>
        <p><mark>Abel Makkonen Tesfaye</mark>, Canadian legend.</p>
        <hr>
        <h2>Essential Discography</h2>
        <ul>
            <li>Starboy (2016)</li>
            <li>After Hours (2020)</li>
            <li>Dawn FM (2022)</li>
        </ul>
        <div class="media-box">
            <h3>Album Statistics</h3>
            <table>
                <colgroup>
                    <col style="background-color: #2c2c2c;"><col style="background-color: #3d3d3d;"><col style="background-color: #2c2c2c;">
                </colgroup>
                <thead><tr><th>Album</th><th>Year</th><th>Wins</th></tr></thead>
                <tbody>
                    <tr><td>Starboy</td><td>2016</td><td>1</td></tr>
                    <tr><td>After Hours</td><td>2020</td><td>0</td></tr>
                </tbody>
            </table>
            <h3>Listen: After Hours</h3>
            <audio src="after-hours.mp3" controls loop></audio>
            <h3>Live Performance</h3>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/aZWvbaxlwUg" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
